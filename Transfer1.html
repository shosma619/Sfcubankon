<script>
const form = document.getElementById("transferForm");

// Restore previously entered values
window.addEventListener("DOMContentLoaded", function () {
    const savedData = sessionStorage.getItem("transferFormData");

    if (savedData) {
        const data = JSON.parse(savedData);

        Object.keys(data).forEach(function (name) {
            const field = form.elements[name];

            if (field) {
                field.value = data[name];
            }
        });
    }
});

// Save values whenever the user changes the form
form.addEventListener("input", saveForm);
form.addEventListener("change", saveForm);

function saveForm() {
    const formData = {};

    Array.from(form.elements).forEach(function (field) {
        if (field.name) {
            formData[field.name] = field.value;
        }
    });

    sessionStorage.setItem(
        "transferFormData",
        JSON.stringify(formData)
    );
}

// Save before navigating to the confirmation page
form.addEventListener("submit", function () {
    saveForm();
});
</script>

<script>
document.getElementById("transferForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const formData = new FormData(this);
    const demoData = {};

    for (const [key, value] of formData.entries()) {
        demoData[key] = value.trim();
    }

    // Demo data only; do not use for real banking information.
    demoData.demoMode = true;

    sessionStorage.setItem(
        "sfcuDemoTransfer",
        JSON.stringify(demoData)
    );

    window.location.href = "confirmation.html";
});
</script>
